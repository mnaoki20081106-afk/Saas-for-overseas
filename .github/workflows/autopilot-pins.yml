name: Autopilot / 3時間おき（予約したピンを投稿）

on:
  # ⚠ 2026-08-31: 自動実行を一時停止しています。
  #
  # 理由: Pinterest アプリが Trial access のままで、投稿が必ず失敗するため。
  #   403 {"code":29,"message":"Apps with Trial access may not create Pins in production"}
  # Trial access で作れるのは「作成者にしか見えない Sandbox ピン」なので、
  # 3時間おきに叩き続けても集客にはならず、失敗ログが積み上がるだけです。
  #
  # 再開する条件:
  #   Pinterest の Standard access 審査を通す（OAuth フローの画面録画の提出が必要）
  #   → TODO-HUMAN.md の「Pinterest API アプリを作り、Standard access まで通す」
  #
  # 審査待ちの間の運用:
  #   npx tsx src/cli.ts pins:export
  #   で CSV と画像を書き出し、手動投稿または外部の予約ツールで回せます。
  #
  # schedule:
  #   - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --fund=false

      - name: 予約時刻を過ぎたピンを投稿
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
        run: npx tsx src/cli.ts pins:publish

      - uses: ./.github/actions/commit
        with:
          message: "autopilot: ピンを投稿"
