name: 数値を取る（毎日）

# ─────────────────────────────────────────────────────────────────────
# Pinterest とアフィリエイトネットワークから実測値を取ってきます。
# Claude は一切呼びません。秘密情報（トークン）が必要なので Actions で動かします。
#
# ここで取った数字が data/metrics.json に入り、
# 翌朝の CEO ルーチンがそれを読んで次の判断をします。
# これが自己改善ループの「出口 → 入口」の接続点です。
#
# ⚠ 現在は Pinterest が Trial access のため、数値は取得できません。
#    Standard access の審査が通ってから意味を持ちます。
#    それまでは何も起きませんが、失敗もしません（未設定なら警告して 0 件を返す設計）。
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # UTC 17:00 = 日本時間 翌 02:00（CEO の朝礼より前に数字を揃えておく）
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: 何日分を取得するか
        required: false
        default: "30"

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --fund=false

      - name: Pinterest とアフィリエイトの数値を取得
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          SHAREASALE_AFFILIATE_ID: ${{ secrets.SHAREASALE_AFFILIATE_ID }}
          SHAREASALE_API_TOKEN: ${{ secrets.SHAREASALE_API_TOKEN }}
          SHAREASALE_API_SECRET: ${{ secrets.SHAREASALE_API_SECRET }}
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          PARTNERSTACK_API_SECRET: ${{ secrets.PARTNERSTACK_API_SECRET }}
        run: npx tsx src/cli.ts analytics "${{ github.event.inputs.days || '30' }}"

      - uses: ./.github/actions/commit
        with:
          message: "autopilot: 数値を取得"
