name: Autopilot / 毎週（数値取得 → 勝ち型の横展開 → レポート）

on:
  # ⚠ 2026-08-31: autopilot-daily と同じ理由で一時停止中。
  # 再開条件は .github/workflows/autopilot-daily.yml のコメントを参照。
  # schedule:
  #   # 毎週月曜 UTC 04:00 = 日本時間 13:00
  #   - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: 計測と最適化
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          SHAREASALE_AFFILIATE_ID: ${{ secrets.SHAREASALE_AFFILIATE_ID }}
          SHAREASALE_API_TOKEN: ${{ secrets.SHAREASALE_API_TOKEN }}
          SHAREASALE_API_SECRET: ${{ secrets.SHAREASALE_API_SECRET }}
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          PARTNERSTACK_API_SECRET: ${{ secrets.PARTNERSTACK_API_SECRET }}
        run: npx tsx src/cli.ts weekly

      - name: 公開ゲートを判定
        id: guard
        run: npx tsx src/cli.ts guard:check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - if: steps.guard.outputs.publishable == 'true'
        uses: ./.github/actions/commit
        with:
          message: "autopilot: 週次レポートと勝ち型の横展開"

      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.publishable == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.publishable == 'true'
        with:
          path: public
      - uses: actions/deploy-pages@v4
        if: steps.guard.outputs.publishable == 'true'

      - name: 公開を見送った理由を表示
        if: steps.guard.outputs.publishable != 'true'
        run: echo "::warning::公開を見送りました — ${{ steps.guard.outputs.reason }}"
