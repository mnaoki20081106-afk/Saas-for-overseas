name: Autopilot / 毎日（記事1本 + ピン10枚 + 投稿 + サイト再生成）

on:
  schedule:
    # UTC 03:00 = 日本時間 12:00
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      articles:
        description: 記事を何本書くか（初回は bootstrap 相当にしたいときに増やす）
        required: false
        default: "1"

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: パイプラインを実行
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          IMPACT_ACCOUNT_SID: ${{ secrets.IMPACT_ACCOUNT_SID }}
          IMPACT_AUTH_TOKEN: ${{ secrets.IMPACT_AUTH_TOKEN }}
          SHAREASALE_AFFILIATE_ID: ${{ secrets.SHAREASALE_AFFILIATE_ID }}
          SHAREASALE_API_TOKEN: ${{ secrets.SHAREASALE_API_TOKEN }}
          SHAREASALE_API_SECRET: ${{ secrets.SHAREASALE_API_SECRET }}
          PARTNERSTACK_API_KEY: ${{ secrets.PARTNERSTACK_API_KEY }}
          PARTNERSTACK_API_SECRET: ${{ secrets.PARTNERSTACK_API_SECRET }}
        run: |
          if [ "${{ github.event.inputs.articles }}" != "" ] && [ "${{ github.event.inputs.articles }}" != "1" ]; then
            npx tsx src/cli.ts bootstrap "${{ github.event.inputs.articles }}"
          else
            npx tsx src/cli.ts daily
          fi

      - name: 生成物をコミット
        uses: ./.github/actions/commit
        with:
          message: "autopilot: 毎日の実行（記事・ピン・データ更新）"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
