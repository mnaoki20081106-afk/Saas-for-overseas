name: Commit autopilot output
description: パイプラインが生成したファイルをリポジトリに戻す

inputs:
  message:
    description: コミットメッセージ
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        git config user.name  "autopilot[bot]"
        git config user.email "autopilot@users.noreply.github.com"
        # 存在するパスだけを add する。`git add -A a b c` は複数パスのうち
        # 1つでも存在しないと全体を黙って失敗させる（2>/dev/null で握りつぶすと
        # 気づけない）。daily では REPORT.md が作られないため、これが原因で
        # 記事・ピン・データが一度もコミットされていなかった。
        for path in data content assets config/affiliate-links.json TODO-HUMAN.md REPORT.md docs; do
          if [ -e "$path" ]; then
            git add -A -- "$path"
          fi
        done
        if git diff --cached --quiet; then
          echo "変更なし"
          exit 0
        fi
        git commit -m "${{ inputs.message }}"
        for i in 1 2 3 4; do
          if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push 成功"
            exit 0
          fi
          echo "push 失敗、$((2 ** i)) 秒後に再試行"
          sleep $((2 ** i))
        done
        echo "::error::push に 4 回失敗しました"
        exit 1
