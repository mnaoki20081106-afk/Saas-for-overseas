name: Commit autopilot output
description: パイプラインが生成したファイルをリポジトリに戻す

inputs:
  message:
    description: コミットメッセージ
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        git config user.name  "autopilot[bot]"
        git config user.email "autopilot@users.noreply.github.com"
        git add -A data content assets config/affiliate-links.json TODO-HUMAN.md REPORT.md docs 2>/dev/null || true
        if git diff --cached --quiet; then
          echo "変更なし"
          exit 0
        fi
        git commit -m "${{ inputs.message }}"
        for i in 1 2 3 4; do
          if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "push 成功"
            exit 0
          fi
          echo "push 失敗、$((2 ** i)) 秒後に再試行"
          sleep $((2 ** i))
        done
        echo "::error::push に 4 回失敗しました"
        exit 1
